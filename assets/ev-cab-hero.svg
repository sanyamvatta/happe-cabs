<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Premium electric cab at night</title>
  <desc id="desc">A dark green luxury electric cab driving through a futuristic city road with green charging light trails.</desc>
  <defs>
    <linearGradient id="sky" x1="720" y1="0" x2="720" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1408"/>
      <stop offset="0.55" stop-color="#030503"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="carPaint" x1="420" y1="535" x2="1120" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050705"/>
      <stop offset="0.35" stop-color="#315917"/>
      <stop offset="0.68" stop-color="#478221"/>
      <stop offset="1" stop-color="#050705"/>
    </linearGradient>
    <linearGradient id="glass" x1="552" y1="354" x2="928" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1fbf4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#478221" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(836 596) rotate(90) scale(342 638)">
      <stop stop-color="#478221" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#478221" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
